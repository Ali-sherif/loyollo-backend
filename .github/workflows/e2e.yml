name: E2E

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: loyollo
          POSTGRES_PASSWORD: loyollo
          POSTGRES_DB: loyollo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loyollo -d loyollo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://loyollo:loyollo@localhost:5432/loyollo
      E2E_DATABASE_URL: postgresql://loyollo:loyollo@localhost:5432/loyollo
      E2E_RUN_ID: gha_${{ github.run_id }}_${{ github.run_attempt }}_${{ github.job }}
      E2E_WORKER_COUNT: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:e2e
