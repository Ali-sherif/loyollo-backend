services:
  postgres:
    image: postgres:18.6
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: loyollo
      POSTGRES_PASSWORD: loyollo
      POSTGRES_DB: loyollo
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyollo -d loyollo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
