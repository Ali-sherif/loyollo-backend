services:
  postgres:
    image: postgres:18.6
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: loyollo
      POSTGRES_PASSWORD: loyollo
      POSTGRES_DB: loyollo
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyollo -d loyollo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Rate-limiter storage only (ADR-020). Auth fails closed when this is down.
  # Reused by BullMQ campaign workers in LOYB-9 (ADR-021) — do not add a second Redis.
  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
